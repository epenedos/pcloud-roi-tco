name: pamroi

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pamroi
      POSTGRES_PASSWORD: pamroi
      POSTGRES_DB: pamroi
    volumes:
      - pamroi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pamroi -d pamroi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m

  api:
    build: ./api
    environment:
      PAMROI_DATABASE_URL: postgresql+psycopg://pamroi:pamroi@db:5432/pamroi
      PAMROI_WEB_BASE_URL: http://web:80
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    mem_limit: 1g

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
    restart: unless-stopped
    mem_limit: 256m

  # ---- dev profile: hot reload ----
  api-dev:
    profiles: ["dev"]
    build: ./api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PAMROI_DATABASE_URL: postgresql+psycopg://pamroi:pamroi@db:5432/pamroi
    volumes:
      - ./api:/srv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web-dev:
    profiles: ["dev"]
    image: node:22-slim
    working_dir: /src
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_PROXY: http://api-dev:8000
    volumes:
      - ./web:/src
    ports:
      - "5173:5173"
    depends_on:
      - api-dev

volumes:
  pamroi_pgdata:
